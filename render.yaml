services:
  - type: web
    name: rag-sense
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -U pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
